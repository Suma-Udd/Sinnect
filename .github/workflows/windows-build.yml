name: Windows build

# Builds the Windows installer. Runs on version tags (v0.1.0 etc.) and can be
# started by hand from the Actions tab. The installer shows up as a download
# under the run, and on tags it's published as a GitHub release so people can
# grab Sinnect-Setup.exe from the Releases page.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npx tauri build
      - name: Name the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName Sinnect-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sinnect-windows-installer
          path: Sinnect-Setup.exe
      - name: Install it like a user would and film it
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Installer ./Sinnect-Setup.exe -Out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-recording
          path: smoke/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Sinnect ${{ github.ref_name }}
          make_latest: true
          files: Sinnect-Setup.exe
          body: |
            ## Install on Windows
            1. Download **Sinnect-Setup.exe** below.
            2. Open it and click through the installer.
            3. If Windows says "Windows protected your PC", click **More info** then **Run anyway**. That shows up for any new app that isn't code-signed yet.
            4. Open Sinnect from the Start menu and click **Sign in with Claude** (or use an API key in Settings).
