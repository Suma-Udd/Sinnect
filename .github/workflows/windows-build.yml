name: Windows build

# Release a new version: Actions tab > "Windows build" > Run workflow, type the
# version (like 0.1.1) and optional notes. It bumps the version, tags it, builds
# and tests the installer, and publishes the release. Installed copies of
# Sinnect see the update the next time they open.
#
# Leave the version empty for a test build (installer only shows up under the run).
# Pushing a v* tag yourself also publishes a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, like 0.1.1 (empty = test build, nothing published)'
        required: false
        default: ''
      notes:
        description: "What's new (shown in the app's update popup)"
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out what we're releasing
        id: rel
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; echo "publish=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"; v="${v#v}"; echo "publish=true" >> $GITHUB_OUTPUT; echo "bump=true" >> $GITHUB_OUTPUT
          else
            v="$(node -p "require('./src-tauri/tauri.conf.json').version")"; echo "publish=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "Version $v"

      - name: Check the signing key is set up
        if: steps.rel.outputs.publish == 'true' && env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and variables > Actions) before releasing."
          exit 1

      - name: Bump the version and tag it
        if: steps.rel.outputs.bump == 'true'
        shell: bash
        run: |
          v="${{ steps.rel.outputs.version }}"
          if git ls-remote --exit-code --tags origin "v$v" >/dev/null; then echo "::error::v$v already exists"; exit 1; fi
          node scripts/set-version.mjs "$v"
          git config user.name "Sumayer"
          git config user.email "192648348+Suma-Udd@users.noreply.github.com"
          git commit -am "Release v$v"
          git tag "v$v"
          git push origin HEAD:main "v$v"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test

      - name: Build installer
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            # Test build without the key: skip the update files.
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build
          fi

      - name: Name the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Sinnect-Setup.exe
          if (Test-Path "$($exe.FullName).sig") { Copy-Item "$($exe.FullName).sig" Sinnect-Setup.exe.sig }

      - uses: actions/upload-artifact@v4
        with:
          name: sinnect-windows-installer
          path: Sinnect-Setup.exe

      - name: Install it like a user would and film it
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Installer ./Sinnect-Setup.exe -Out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-recording
          path: smoke/

      - name: Write latest.json for the in-app updater
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: node scripts/latest-json.mjs "${{ steps.rel.outputs.version }}" Sinnect-Setup.exe Sinnect-Setup.exe.sig "$NOTES"

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          name: Sinnect v${{ steps.rel.outputs.version }}
          make_latest: true
          files: |
            Sinnect-Setup.exe
            Sinnect-Setup.exe.sig
            latest.json
          body: |
            ${{ inputs.notes }}

            ## Install on Windows
            1. Download **Sinnect-Setup.exe** below.
            2. Open it and click through the installer.
            3. If Windows says "Windows protected your PC", click **More info** then **Run anyway**. That shows up for any new app that isn't code-signed yet.
            4. Open Sinnect from the Start menu and click **Sign in with Claude** (or use an API key in Settings).

            Already have Sinnect? It'll offer this update the next time you open it.
