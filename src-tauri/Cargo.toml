[package]
name = "sinnect"
version = "0.1.4"
description = "An infinite canvas for running, watching and connecting Claude sessions"
authors = ["Sinnect contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sinnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
